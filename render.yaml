services:
  - type: web
    name: merrytext-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-d46c0vqdbo4c738ds160-a.oregon-postgres.render.com/merrytext_db
      - key: SPRING_DATASOURCE_USERNAME
        value: merrytext_db_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Set this in Render dashboard for security
      - key: JWT_SECRET
        sync: false # Set this in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false # Set this in Render dashboard
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false # Set this in Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Set this in Render dashboard
      - key: FRONTEND_URL
        value: http://localhost:3000 # Update with your frontend URL
      - key: SUPABASE_URL
        value: https://bzshoukkpprusjmisyrw.supabase.co
      - key: SUPABASE_KEY
        sync: false # Set this in Render dashboard
      - key: SUPABASE_BUCKET_NAME
        value: merrytext-media
      - key: GOOGLE_CLIENT_ID
        sync: false # Set this in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set this in Render dashboard
      - key: OAUTH2_REDIRECT_URI
        value: http://localhost:3000/auth/callback # Update with your frontend URL
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JPA_DDL_AUTO
        value: update
    healthCheckPath: /actuator/health
